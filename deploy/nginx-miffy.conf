# 米菲记账 - nginx 配置
# 双入口：直接 IP（http://IP/） + 安全路径（http://IP/v15767602297/）
# 前端静态 127.0.0.1:8081，后端 API /uploads 127.0.0.1:8080

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 8M;  # 头像/模块图标上传限制（需大于后端 5MB）

    # ===== 安全路径入口 /v15767602297 =====
    location = /v15767602297 {
        return 301 /v15767602297/;
    }
    location ^~ /v15767602297/api/ {
        rewrite ^/v15767602297(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
    location ^~ /v15767602297/uploads/ {
        rewrite ^/v15767602297(/uploads/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
    location ^~ /v15767602297/ {
        rewrite ^/v15767602297/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
    }

    # ===== 直接 IP 入口 =====
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/proxy_params;
    }
}
